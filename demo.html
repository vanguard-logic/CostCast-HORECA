<style>
:root{
  --link:#1846A3;
  --blue:#1846A3; --blue-d:#0F2F73; --blue-l:#E8EEFA;
  --red:#C8102E; --red-l:#FBE7EA;
  --gold:#C08A4E; --gold-l:#F7EEE3;
  --purple:#6B2A7A;
  --green:#127A3E; --green-l:#E4F4EA;
  --ink:#1B2333; --ink2:#4A5468; --line:#DCE2EE; --bg:#F4F6FB; --card:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:16px}
.hide{display:none!important}

/* Sign in */
#start,#signin{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 90px}
.si-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;width:100%;max-width:420px;box-shadow:0 8px 30px rgba(24,70,163,.08)}
.si-logo{width:100%;max-width:340px;display:block;margin:0 auto 6px}
.si-ver{text-align:center;color:var(--ink2);font-size:14px;margin-bottom:16px}
.seg{display:flex;background:var(--blue-l);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;padding:10px 4px;border-radius:9px;font-weight:700;color:var(--link);cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.vld-logo{width:100%;max-width:340px;display:block;margin:0 auto 14px;border-radius:14px}
.vld-sm{width:100%;max-width:200px;display:block;margin:0 auto 12px;border-radius:10px}
.lvl{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.lvl .btn{padding:14px;font-size:17px}
.si-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.si-head h3{flex:1;text-align:center;font-size:18px;color:var(--blue-d)}
.sw-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:6px}
.sw{border:2px solid var(--line);border-radius:12px;padding:8px 6px;background:var(--card);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.sw.on{border-color:var(--link);box-shadow:0 0 0 2px var(--blue-l)}
.sw i{display:flex;width:100%;height:24px;border-radius:7px;overflow:hidden;border:1px solid rgba(0,0,0,.12)}
.sw i span{flex:1}

/* Fields */
label.f{display:block;font-size:14px;font-weight:700;color:var(--ink2);margin:10px 0 4px}
.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--card);color:var(--ink)}
.in:focus{outline:2px solid var(--link);border-color:var(--link)}
.pw{position:relative}
.pw .in{padding-right:46px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:36px;height:36px;cursor:pointer;color:var(--ink2)}
.eye svg{width:22px;height:22px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* Buttons */
a.btn{text-decoration:none}
.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.b-blue{background:var(--blue);color:#fff}
.b-red{background:var(--red);color:#fff}
.b-gold{background:var(--gold);color:#fff}
.b-line{background:var(--card);color:var(--link);border:1.5px solid var(--link)}
.b-del{background:var(--card);color:var(--red);border:1.5px solid var(--red)}
.b-sm{padding:7px 10px;font-size:14px;border-radius:8px}
.full{width:100%}
.link{background:none;border:0;color:var(--link);font-weight:700;cursor:pointer;padding:8px;text-decoration:underline}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btnrow .btn{flex:1 1 auto}

/* App shell */
#app{min-height:100vh;padding-bottom:128px}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:6px 16px 8px}
.pw-line{text-align:center;font-size:12px;color:var(--ink2);margin-bottom:8px}
.pw-line b{color:var(--ink)}
.top-in{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top-logo{height:38px;width:auto}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2)}
.who b{color:var(--ink)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--blue-l);color:var(--link)}
main{max-width:900px;margin:0 auto;padding:14px 16px}
h2.pg{font-size:22px;color:var(--blue-d);margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font-size:17px;color:var(--blue-d);margin-bottom:8px}
.muted{color:var(--ink2);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--blue-l);border-radius:10px;padding:9px 8px;text-align:center}
.kpi span{display:block;font-size:12px;color:var(--ink2)}
.kpi b{font-size:16px;color:var(--blue-d)}
.kpi b.warn{color:var(--red)}.kpi b.ok{color:var(--green)}
.big{font-size:30px;font-weight:800;color:var(--blue-d)}
.split{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}
.split:last-child{border-bottom:0}
.split b{white-space:nowrap}
.tot{font-size:17px;color:var(--red);font-weight:800;border-top:2px solid var(--ink);margin-top:4px;padding-top:9px;border-bottom:0}
.tier{border-radius:12px;padding:11px 12px;margin-bottom:8px;border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.tier small{display:block;color:var(--ink2);font-size:13px}
.tier b{font-size:18px;white-space:nowrap}
.t1{background:var(--blue-l);border-color:#BFD0F0}
.t4{background:var(--green-l);border-color:#A9DBBD}
.t4 b{color:var(--green);font-size:22px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--blue);color:#fff;text-align:left;padding:8px 7px;font-weight:700;white-space:nowrap}
td{padding:8px 7px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
tr.sub td{background:var(--gold-l);font-weight:700}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px}
.p-raw{background:var(--blue-l);color:var(--link)}
.p-add{background:#F1E6F4;color:var(--purple)}
.p-pack{background:var(--gold-l);color:#8A5A22}
.p-util{background:#E6F2F4;color:#1C6B78}
.hidden-q{color:var(--purple);font-weight:700}
input[type=range]{width:100%;accent-color:var(--link)}
.list-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.li-name{font-weight:700}
.warn{color:var(--red);font-weight:700}
.ok{color:var(--green);font-weight:700}
.search{margin-bottom:10px}
.note{background:var(--gold-l);border-left:4px solid var(--gold);padding:9px 11px;border-radius:8px;font-size:14px;margin:8px 0}

/* Bottom nav + footer */
.navbar{position:fixed;left:0;right:0;bottom:30px;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center}
.navbar-in{display:flex;width:100%;max-width:900px}
.navbar button{flex:1;border:0;background:var(--card);padding:8px 2px 7px;font-weight:700;font-size:14px;color:var(--ink2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.navbar button svg{width:22px;height:22px}
.navbar button.on{color:var(--link)}
.navbar button.on svg{stroke:var(--link)}
.foot{position:fixed;left:0;right:0;bottom:0;height:30px;z-index:31;background:var(--blue-d);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 8px;text-align:center}

/* Modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(15,25,50,.45);display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 16px 18px}
@media(min-width:700px){.ov{align-items:center}.md{border-radius:18px}}
.md-h{position:sticky;top:0;background:var(--card);display:flex;align-items:center;gap:8px;padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:8px;z-index:2}
.md-h h3{flex:1;font-size:18px;color:var(--blue-d)}
.xb{border:0;background:var(--blue-l);color:var(--link);width:36px;height:36px;border-radius:50%;font-size:20px;font-weight:700;cursor:pointer;flex:none}
.md-f{display:flex;gap:8px;margin-top:14px}
.md-f .btn{flex:1}
.bom-line{display:grid;grid-template-columns:1fr 92px 40px;gap:6px;align-items:center;margin-bottom:6px}
.bom-line.m{grid-template-columns:1fr 80px 70px 40px}
.bom-line .in{padding:9px 8px;font-size:15px}
.rm{border:0;background:var(--red-l);color:var(--red);height:38px;border-radius:8px;font-weight:800;cursor:pointer;font-size:18px}
#block{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;display:flex;align-items:center;justify-content:center;padding:20px 16px 50px}
#block .si-card{text-align:center}
#block h3{font-size:20px;color:var(--red);margin:8px 0}
.demo-bar{background:var(--gold-l);border:1px solid var(--gold);border-radius:12px;padding:9px 12px;margin-bottom:12px;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:140px;z-index:60;background:#1B2333;color:#fff;box-shadow:0 4px 18px rgba(0,0,0,.3);padding:10px 14px 10px 16px;border-radius:12px;font-size:15px;display:flex;align-items:center;gap:10px;max-width:92%}
.toast button{border:0;background:transparent;color:#fff;font-size:18px;font-weight:700;cursor:pointer}
.spin{width:30px;height:30px;border:4px solid var(--blue-l);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:14px auto}
@keyframes sp{to{transform:rotate(360deg)}}

html.dk .p-add,html.dk .hidden-q{color:#E2B4EE}
html.dk .p-add{background:#3A2442}
html.dk .p-pack{color:#EBC596;background:#3A2F22}
html.dk .p-util{color:#93D6DF;background:#173A40}
html.dk .kpi b,html.dk h2.pg,html.dk .card h3{color:#E9EDF5}
html.dk .big{color:#FFFFFF}
@media print{
  header.top,.navbar,.foot,.powered,.btnrow,.noprint,input[type=range]{display:none!important}
  #app{padding:0}
  .card{break-inside:avoid;border-color:#999}
  body{background:#fff}
}
</style>
</head>

function mix(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const x = p(a), y = p(b);
  return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('');

/* ---------- costing engine ---------- */
const target = p => { const v = p.kind === 'Drink' ? S.settings.drinkPct : S.settings.foodPct; return Math.min(95, Math.max(1, num(v))); };
function guestOf(price) {
  const st = S.settings;
  const sc = price * num(st.scPct) / 100;
  const sscl = (price + sc) * num(st.ssclPct) / 100;
  const vat = (price + sc + sscl) * num(st.vatPct) / 100;
  return { sc, sscl, vat, guest: price + sc + sscl + vat };
}
function costMenu(p) {
  const lines = (p.lines || []).map(l => {
    const m = mat(l.mid); if (!m) return null;
    const y = Math.min(100, Math.max(1, num(m.yield) || 100));
    const q = num(l.q);
    return { m, q, y, buy: q * 100 / y, cost: q * m.price * 100 / y };
  }).filter(Boolean);
  const raw = lines.reduce((a, l) => a + l.cost, 0);
  const waste = raw * num(p.wastePct) / 100;
  const total = raw + waste;
  const portions = Math.max(1, num(p.portions));
  const unit = total / portions;
  const tg = target(p);
  const suggested = unit / (tg / 100);
  const hasPrice = num(p.price) > 0;
  const price = hasPrice ? num(p.price) : suggested;
  const costPct = price > 0 ? unit / price * 100 : 0;
  const g = guestOf(price);
  return { lines, raw, waste, total, portions, unit, tg, suggested, hasPrice, price, costPct, profit: price - unit, over: hasPrice && costPct > tg, ...g, sGuest: guestOf(suggested).guest };
}
function summary() {
  const out = {};
  KINDS.forEach(k => {
    const list = S.menu.filter(p => p.kind === k && num(p.price) > 0).map(costMenu);
    const cost = list.reduce((a, c) => a + c.unit, 0), sales = list.reduce((a, c) => a + c.price, 0);
    out[k] = { n: list.length, pct: sales > 0 ? cost / sales * 100 : 0, tg: k === 'Drink' ? num(S.settings.drinkPct) : num(S.settings.foodPct), over: list.filter(c => c.over).length };
  });
  return out;
}

function matOptions(sel) { return S.items.map(m => `<option value="${m.id}"${m.id === sel ? ' selected' : ''}>${esc(m.name)} (${esc(m.unit)})</option>`).join(''); }
function editMenu(pid) {
  const old = pid ? S.menu.find(x => x.id === pid) : null;
  const p = old ? JSON.parse(JSON.stringify(old)) : { id: uid('n'), name: '', kind: 'Food', cat: '', portions: 1, wastePct: 5, price: 0, lines: [] };
  const field = (k, l) => `<div><label class="f">${l}</label><input class="in" type="number" inputmode="decimal" step="any" id="me_${k}" value="${esc(p[k])}"></div>`;

  const body = () => `
    <label class="f">Menu item name</label><input class="in" id="me_name" value="${esc(p.name)}">
    <div class="row2"><div><label class="f">Type</label><select class="in" id="me_kind">${KINDS.map(k => `<option${k === p.kind ? ' selected' : ''}>${k}</option>`).join('')}</select></div>
    <div><label class="f">Group</label><input class="in" id="me_cat" value="${esc(p.cat || '')}" placeholder="Main, Mocktail"></div></div>
    <div class="row3">${field('portions', 'Portions')}${field('wastePct', 'Waste %')}${field('price', 'Menu price LKR')}</div>
    <p class="muted" style="margin-top:6px">Portions: how many portions this recipe makes. Menu price: without service charge and tax. Leave 0 to use the suggested price.</p>

    <p class="muted">Example: 320 g chicken = 0.32 kg</p>
    <div id="meLines">${p.lines.map(row).join('')}</div>
    <button class="btn b-line b-sm" id="meAdd">+ Add item</button>`;
  const id = modal(old ? 'Edit menu item' : 'Add menu item', `<div id="meBody">${body()}</div>`, `<button class="btn b-line" data-close>Cancel</button><button class="btn b-blue" id="meSave">Save</button>`, true);
  const read = () => {
    p.name = $('me_name').value.trim(); p.kind = $('me_kind').value; p.cat = $('me_cat').value.trim();
    ['portions', 'wastePct', 'price'].forEach(k => p[k] = num($('me_' + k).value));

  };

    $('meAdd').onclick = () => { if (!S.items.length) return toast('Add items in Items first'); read(); p.lines.push({ mid: S.items[0].id, q: 0 }); $('meBody').innerHTML = body(); wire(); };
    $(id).querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { read(); p.lines.splice(+b.closest('.bom-line').dataset.i, 1); $('meBody').innerHTML = body(); wire(); });
    $(id).querySelectorAll('[data-f=mid]').forEach(s => s.onchange = () => { s.closest('.bom-line').querySelector('[data-u]').textContent = unitOf(s.value); });
  };

  $('meSave').onclick = () => {
    read();

    if (!(p.portions > 0)) return toast('Portions must be more than 0');

    if (p.lines.some(l => !(num(l.q) > 0))) return toast('Every recipe item needs a quantity more than 0');

function itemForm(m) {
  return `<label class="f">Item name</label><input class="in" id="ie_name" value="${esc(m.name)}">

function editItem(mid) {
  const old = mid ? mat(mid) : null;
  const m = old ? { ...old } : { id: uid('i'), name: '', type: 'Food', unit: 'kg', price: 0, yield: 100, supplier: '' };
  const id = modal(old ? 'Edit item' : 'Add item', itemForm(m), `<button class="btn b-line" data-close>Cancel</button><button class="btn b-blue" id="ieSave">Save</button>`);
  $('ieSave').onclick = () => {
    m.name = $('ie_name').value.trim(); m.type = $('ie_type').value; m.unit = $('ie_unit').value; m.price = num($('ie_price').value); m.yield = num($('ie_yield').value); m.supplier = $('ie_sup').value.trim();
    if (!m.name) return toast('Type the item name');
    if (!(m.price > 0)) return toast('Type the price');
    if (!(m.yield > 0 && m.yield <= 100)) return toast('Yield must be 1 to 100%');
    if (S.items.some(x => x.id !== m.id && x.name.toLowerCase() === m.name.toLowerCase())) return toast('This item name is already in the list');
    if (old && old.unit !== m.unit && S.menu.some(p => p.lines.some(l => l.mid === m.id)))
      return message('Unit change', 'This item is used in a menu item. Its quantities are in ' + esc(old.unit) + '. Keep the same unit, or remove the item from the menu item first.');
    if (old) Object.assign(old, m); else S.items.unshift(m);
    save(); close(id); toast('Item saved'); pageItems();
  };
}
function cleanRow(r) {
  if (!r) return null;
  const name = String(r[0] == null ? '' : r[0]).trim();
  const tIn = String(r[1] == null ? '' : r[1]).trim().toLowerCase();
  const type = TYPES.find(t => t.toLowerCase() === tIn) || (tIn.startsWith('dr') || tIn.startsWith('bev') || tIn.startsWith('bar') ? 'Drink' : tIn.startsWith('oth') || tIn.startsWith('pack') ? 'Other' : 'Food');
  const uIn = String(r[2] == null ? '' : r[2]).trim().toLowerCase();
  const unit = UNITS.find(u => u.toLowerCase() === uIn) || (uIn.startsWith('lit') ? 'L' : uIn.startsWith('pc') || uIn.startsWith('no') || uIn.startsWith('unit') || uIn.startsWith('bot') ? 'pcs' : 'kg');
  const price = num(r[3]);
  const yIn = num(r[4]);
  const yld = yIn > 0 && yIn <= 100 ? yIn : 100;
  const supplier = String(r[5] == null ? '' : r[5]).trim();
  if (!name || /^name$/i.test(name) || !(price > 0)) return null;
  return { name, type, unit, price, yield: yld, supplier };
}
function addItems(rows, label) {
  let added = 0, updated = 0;
  rows.forEach(r => {
    const ex = S.items.find(m => m.name.toLowerCase() === r.name.toLowerCase());
    if (ex) { ex.price = r.price; ex.yield = r.yield; if (r.supplier) ex.supplier = r.supplier; updated++; }
    else { S.items.unshift({ id: uid('i'), ...r }); added++; }
  });
  save(); pageItems();
  message(label, `${added} new item(s) added.<br>${updated} item price(s) updated.`);
}
function pasteItems() {
  const id = modal('Paste from Excel', `<p class="muted">Copy rows from Excel and paste here. Columns: Name, Type, Unit, Price, Yield %, Supplier.</p>
    <textarea class="in" id="paTxt" rows="8" style="margin-top:8px" placeholder="Prawns	Food	kg	3400	60	Fish Supplier"></textarea>`,
    `<button class="btn b-line" data-close>Cancel</button><button class="btn b-blue" id="paSave">Save</button>`);
  $('paSave').onclick = () => {
    const rows = $('paTxt').value.split(/\r?\n/).map(l => l.includes('\t') ? l.split('\t') : l.split(';')).map(cleanRow).filter(Boolean);

    close(id); addItems(rows, 'Paste');

}
function itemTemplate() {

  const ws = XLSX.utils.aoa_to_sheet([['Name', 'Type', 'Unit', 'Price (LKR)', 'Yield %', 'Supplier'], ['Prawns', 'Food', 'kg', 3400, 60, 'Fish Supplier'], ['Ginger Ale 330 ml', 'Drink', 'pcs', 220, 100, 'Drinks Supplier']]);

$('fileXls').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  if (!window.XLSX) return message('Excel', 'Excel tool did not load. Check the internet and open CostCast HORECA again.');
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const wb = XLSX.read(new Uint8Array(rd.result), { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true }).map(cleanRow).filter(Boolean);
      if (!rows.length) return message('Excel', 'No items found. Use the form: Name, Type, Unit, Price, Yield %, Supplier.');
      addItems(rows, 'Excel upload');
    } catch (err) { message('Excel', 'This file could not be read.'); }
  };
  rd.readAsArrayBuffer(f);
};

/* ---------- Scan (bill / invoice photo) ---------- */
function loadOCR() {
  return new Promise((ok, bad) => {
    if (window.Tesseract) return ok();
    const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = ok; s.onerror = bad; document.head.appendChild(s);
  });
}
$('fileScan').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const wid = modal('Scan', `<div class="spin"></div><p class="muted" style="text-align:center" id="scMsg">Reading the bill...</p>`, `<button class="btn b-line" data-close>Cancel</button>`);
  try {
    await loadOCR();
    const res = await Tesseract.recognize(f, 'eng', { logger: m => { const el = $('scMsg'); if (el && m.status === 'recognizing text') el.textContent = 'Reading the bill... ' + Math.round(m.progress * 100) + '%'; } });
    if (!$(wid)) return;
    close(wid);
    const skip = /(total|sub ?total|vat|tax|discount|balance|invoice|date|phone|tel|bill no|cash|change|amount due|page)/i;
    const found = [];
    res.data.text.split(/\n/).forEach(line => {
      const t = line.replace(/\s+/g, ' ').trim();
      if (t.length < 4 || skip.test(t)) return;
      const mm = t.match(/^(.*?[A-Za-z].*?)\s+(?:LKR|Rs\.?)?\s*([\d,]+(?:\.\d{1,2})?)\s*$/i);
      if (!mm) return;
      const name = mm[1].replace(/[\d.,]+\s*(kg|g|l|ml|pcs|nos)?\s*[x×@]?\s*$/i, '').replace(/[|:;_-]+$/, '').trim();
      const price = num(mm[2]);
      if (name.length >= 3 && price > 0) found.push({ name, type: 'Food', unit: 'kg', price, yield: 100, on: true });
    });
    if (!found.length) return message('Scan', 'No item lines were found. Try again with a clear, flat photo in good light, or use + Add.');
    reviewScan(found);
  } catch (err) {
    close(wid); message('Scan', 'Scan did not work. Check the internet and try again.');
  }
};
function reviewScan(rows) {
  const body = `<p class="muted">Check each line. Fix the name, type, unit and price. Untick lines you do not want.</p>
    ${rows.map((r, i) => `<div class="card" style="padding:10px;margin-top:8px" data-i="${i}">
      <label style="display:flex;gap:8px;align-items:center;font-weight:700"><input type="checkbox" data-f="on"${r.on ? ' checked' : ''} style="width:20px;height:20px"> Save this line</label>
      <input class="in" style="margin-top:6px" data-f="name" value="${esc(r.name)}">
      <div class="row3" style="margin-top:6px"><select class="in" data-f="type">${TYPES.map(t => `<option${t === r.type ? ' selected' : ''}>${t}</option>`).join('')}</select>
      <select class="in" data-f="unit">${UNITS.map(u => `<option${u === r.unit ? ' selected' : ''}>${u}</option>`).join('')}</select>
      <input class="in" type="number" inputmode="decimal" data-f="price" value="${r.price}"></div></div>`).join('')}
    <label class="f">Supplier (for all lines)</label><input class="in" id="scSup">`;
  const id = modal('Scan result', body, `<button class="btn b-line" data-close>Cancel</button><button class="btn b-blue" id="scSave">Save</button>`, true);
  $('scSave').onclick = () => {
    const sup = $('scSup').value.trim();
    $(id).querySelectorAll('[data-i]').forEach(c => { const r = rows[+c.dataset.i]; c.querySelectorAll('[data-f]').forEach(inp => r[inp.dataset.f] = inp.type === 'checkbox' ? inp.checked : inp.dataset.f === 'price' ? num(inp.value) : inp.value.trim()); });
    const keep = rows.filter(r => r.on && r.name && r.price > 0).map(r => ({ name: r.name, type: r.type, unit: r.unit, price: r.price, yield: 100, supplier: sup }));
    if (!keep.length) return toast('No lines ticked');
    close(id); addItems(keep, 'Scan');
  };
}

function dl(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
async function sendFile(blob, name, title) {

    try { await navigator.share({ files: [file], title }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  dl(blob, name);
  message('Share', 'The file is saved in Downloads. Open WhatsApp or email and attach it.');
}

}

}

const cloudSetWanted = v => { try { localStorage.setItem(KEY + '_cloud', v ? '1' : '0'); } catch (e) {} };
const cloudLastOk = () => { try { return +localStorage.getItem(KEY + '_cloudok') || 0; } catch (e) { return 0; } };
const cloudMarkOk = () => { try { localStorage.setItem(KEY + '_cloudok', String(Date.now())); } catch (e) {} };
function loadScript(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('load')); document.head.appendChild(s); }); }
async function fbLoad() { if (window.firebase && firebase.firestore && firebase.auth) return; for (const m of ['app', 'auth', 'firestore']) await loadScript(`https://www.gstatic.com/firebasejs/${FB_V}/firebase-${m}-compat.js`); }
async function cloudBoot() {
  if (CLOUD.app) return;
  CLOUD.app = firebase.apps.find(a => a.name === FB_APP) || firebase.initializeApp(FB_CFG, FB_APP);
  CLOUD.db = CLOUD.app.firestore();
  try { await CLOUD.db.enablePersistence({ synchronizeTabs: true }); } catch (e) {}
}
function cloudRefresh() { const el = $('clStatus'); if (el) el.textContent = CLOUD.status; }
function applyRemote(d) {
  const n = JSON.parse(d.data); if (!n.items || !n.menu || !n.users) return;
  CLOUD.rev = d.rev; S = n; fixData(); save(true); applyTheme();
  if (me && me.id !== 'demo') {
    const u = S.users.find(x => x.id === me.id);
    if (!u) return signOut();
    me = u; payShown = false;
    if (!$('modals').children.length) go(tab);
    checkGate();
  }
}
function cloudListen() {
  if (CLOUD.unsub) CLOUD.unsub();
  CLOUD.ref = CLOUD.db.collection(FB_ROOT).doc(CLOUD.user.uid);
  CLOUD.unsub = CLOUD.ref.onSnapshot({ includeMetadataChanges: true }, snap => {
    if (!snap.metadata.fromCache) {
      cloudMarkOk();
      CLOUD.status = 'Connected - synced ' + new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      cloudRefresh();
      if (me && !$('block').classList.contains('hide') && $('blkRetry')) checkGate();
    }
    if (!snap.exists || snap.metadata.hasPendingWrites) return;
    const d = snap.data() || {};
    if (!d.data || d.rev === CLOUD.rev) return;
    try { applyRemote(d); } catch (e) {}
  }, err => { CLOUD.status = 'Error: ' + (err && (err.code || err.message)); cloudRefresh(); });
}
function cloudQueue() {
  if (!CLOUD.user || !CLOUD.ref) return;
  clearTimeout(CLOUD.pushT);
  CLOUD.pushT = setTimeout(cloudPush, 1200);
}
function cloudPush() {
  if (!CLOUD.user || !CLOUD.ref) return Promise.resolve();
  CLOUD.rev = uid('r');
  return CLOUD.ref.set({ data: JSON.stringify(S), rev: CLOUD.rev, at: firebase.firestore.FieldValue.serverTimestamp(), app: APP + ' ' + VER })
    .catch(e => { CLOUD.status = 'Error: ' + (e && (e.code || e.message)); cloudRefresh(); });
}
async function cloudInit(manual) {
  if (TIER.demo || !cloudWanted()) return;
  CLOUD.status = 'Connecting...'; cloudRefresh();
  try { await fbLoad(); await cloudBoot(); } catch (e) { CLOUD.status = 'Offline - will sync when online'; cloudRefresh(); if (manual && me) checkGate(); return; }
  if (!CLOUD.authWired) {
    CLOUD.authWired = true;
    CLOUD.app.auth().onAuthStateChanged(u => {
      CLOUD.user = u;
      if (u && cloudWanted()) cloudListen();
      else if (cloudWanted()) { CLOUD.status = 'Signed out of the cloud. Connect again.'; cloudRefresh(); }
    });
  }
  if (manual) setTimeout(() => { if (me) checkGate(); }, 5000);
}
async function cloudConnect(em, pw) {
  if (!/^\S+@\S+\.\S+$/.test(em) || !pw) return toast('Type the cloud email and password');
  if (location.protocol !== 'https:') return toast('Open CostCast HORECA from its web address to connect');
  CLOUD.status = 'Connecting...'; cloudRefresh();
  try {
    try { await fbLoad(); await cloudBoot(); } catch (e) { throw new Error('no internet - the cloud tool could not load'); }
    const cr = await CLOUD.app.auth().signInWithEmailAndPassword(em, pw);
    CLOUD.user = cr.user;
    const ref = CLOUD.db.collection(FB_ROOT).doc(CLOUD.user.uid);
    let snap;
    try { snap = await ref.get({ source: 'server' }); }
    catch (e) { await CLOUD.app.auth().signOut().catch(() => {}); CLOUD.user = null; throw new Error(/permission/i.test(e && (e.code || e.message) || '') ? 'the cloud is not set up for CostCast HORECA yet. Contact Vanguard Logic Development.' : (e && (e.code || e.message))); }
    cloudSetWanted(true); cloudMarkOk();
    CLOUD.ref = ref;
    if (!CLOUD.authWired) { CLOUD.authWired = true; CLOUD.app.auth().onAuthStateChanged(u => { CLOUD.user = u; }); }
    const d = snap.exists ? snap.data() : null;
    if (d && d.data) {
      applyRemote(d); cloudListen();
      message('Cloud', 'Connected. The cloud data is now on this phone.');
      if (me && me.role !== 'Developer' && !S.users.find(x => x.id === me.id)) signOut();
      else if (tab === 'settings') pageSettings();
    } else {
      await cloudPush(); cloudListen();
      CLOUD.status = 'Connected'; toast('Connected. This phone\'s data is now in the cloud.'); pageSettings();
    }
  } catch (e) {
    CLOUD.status = 'Not connected - ' + String(e && (e.code || e.message) || e).replace('auth/', '').replace(/-/g, ' ');
    cloudRefresh(); toast(CLOUD.status);
  }
}
async function cloudDisconnect() {
  cloudSetWanted(false);
  if (CLOUD.unsub) CLOUD.unsub();
  CLOUD.unsub = null; CLOUD.ref = null;
  try { if (CLOUD.app) await CLOUD.app.auth().signOut(); } catch (e) {}
  CLOUD.user = null; CLOUD.status = 'Not connected'; toast('Disconnected. The data stays on this phone.'); pageSettings();
}
function cloudCard() {
  if (TIER.demo) return '';
  const on = cloudWanted() && CLOUD.user;
  return `<div class="card"><h3>Cloud</h3>
    <p class="muted">Keeps a copy of all data online and shares it with every phone of this business.</p>
    <div class="split"><span>Status</span><b id="clStatus" style="white-space:normal;text-align:right">${esc(cloudWanted() ? CLOUD.status : 'Not connected')}</b></div>
    ${on ? `<div class="split"><span>Cloud email</span><b>${esc(CLOUD.user.email || '')}</b></div>
      <div class="btnrow" style="margin-top:10px"><button class="btn b-blue" id="clSync">Sync</button><button class="btn b-del" id="clOff">Disconnect</button></div>`
    : `<label class="f">Cloud email</label><input class="in" type="email" id="clEmail" autocapitalize="none" placeholder="name@mcrconceptvld.com">
      <label class="f">Cloud password</label><div class="pw"><input class="in" id="clPass" type="password"><button class="eye" type="button" data-eye="clPass"></button></div>
      <button class="btn b-blue full" id="clGo" style="margin-top:12px">Connect</button>
      <p class="muted" style="margin-top:8px">Get the cloud email and password from Vanguard Logic Development.</p>`}
  </div>`;
}
function wireCloud() {
  wireEyes($('page'));
  if ($('clGo')) $('clGo').onclick = () => cloudConnect($('clEmail').value.trim(), $('clPass').value);
  if ($('clSync')) $('clSync').onclick = () => cloudPush().then(() => toast('Synced'));
  if ($('clOff')) $('clOff').onclick = () => confirmBox('Disconnect', 'Disconnect this phone from the cloud? The data stays on this phone and in the cloud.', 'Disconnect', cloudDisconnect);
}

/* ============================================================
   START
   ============================================================ */
load(); save(true); applyTheme(); wireEyes();
document.querySelectorAll('.ver-lbl').forEach(e => e.textContent = 'HORECA · Version ' + VER);
cloudInit();
(function () {
  if (TIER.demo) { me = { id: 'demo', name: 'Demo', role: 'Admin' }; return openApp(); }
  let sid = null; try { sid = sessionStorage.getItem(SKEY); } catch (e) {} const u = sid && S.users.find(x => x.id === sid); if (u) { me = u; openApp(); } else showSignIn();
})();
</script>
</body>
</html>
